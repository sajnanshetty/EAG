<!DOCTYPE html>
<html>
<head>
  <title>AI Page Summarizer</title>
  <style>
    body {
      width: 400px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    #loading {
      display: none;
      color: #666;
      margin: 10px 0;
    }
    #error {
      display: none;
      color: red;
      margin: 10px 0;
    }
    #summary {
      margin-top: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <button id="summarize">Summarize Page</button>
  <div id="loading">Generating summary...</div>
  <div id="error"></div>
  <div id="summary"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
