<!DOCTYPE html>
<html>
<head>
  <title>AI Page Summarizer (Gemini)</title>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    #summary {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #357abd;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .loading {
      display: none;
      text-align: center;
      margin: 10px 0;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>AI Page Summarizer (Gemini)</h2>
  <button id="summarize">Summarize Page</button>
  <div class="loading" id="loading">Generating summary...</div>
  <div class="error" id="error"></div>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body>
</html>
