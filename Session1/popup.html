<!DOCTYPE html>
<html>
<head>
  <title>AI Page Summarizer</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    #summary {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 100px;
      max-height: 300px;
      overflow-y: auto;
    }
    .loading {
      display: none;
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>AI Page Summarizer</h2>
    <button id="summarize">Summarize Page</button>
    <div class="loading" id="loading">Generating summary...</div>
    <div id="summary"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
